name: Perbarui data GEE
# Lapisan dinamis: setiap CSV bulanan GEE yang di-commit ke incoming/ digabung ke panel, deret desa, dan kolom peta tahunan.
on:
  push:
    branches: [main]
    paths: ['incoming/*.csv']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Gabungkan bulan baru
        run: |
          shopt -s nullglob
          files=(incoming/*.csv)
          if [ ${#files[@]} -eq 0 ]; then echo "tidak ada CSV baru"; exit 0; fi
          python pipeline/gee_monthly_update.py "${files[@]}"
          mkdir -p incoming/diproses
          git mv -k "${files[@]}" incoming/diproses/ 2>/dev/null || mv "${files[@]}" incoming/diproses/
      - name: Commit hasil
        run: |
          git config user.name "twin-bot"
          git config user.email "twin-bot@users.noreply.github.com"
          git add -A data dataset incoming
          git diff --cached --quiet || git commit -m "Perbarui lapisan dinamis GEE"
          git push
